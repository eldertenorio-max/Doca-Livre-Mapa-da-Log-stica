<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="Doca Livre — Mapa da Logística. Encontre transportadoras, operadores logísticos e fornecedores do setor."
    />
    <title>Doca Livre — Mapa da Logística</title>
    <script>
      // Endereço oficial é mapadalogistica.com.br: quem chega pelo antigo é levado para lá.
      ;(function () {
        var host = location.hostname
        var antigo = host.endsWith('.onrender.com') || host === 'www.mapadalogistica.com.br'
        if (antigo && !location.search.includes('semredirect')) {
          location.replace(
            'https://mapadalogistica.com.br' + location.pathname + location.search + location.hash,
          )
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
